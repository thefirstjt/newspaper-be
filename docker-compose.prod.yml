# Production stack for the droplet. Unlike docker-compose.yml (which builds the
# image locally), this pulls a prebuilt image from GHCR — CI builds and pushes
# it, and the droplet only runs it. Deploy is driven by .github/workflows/deploy.yml.
#
# Expects /opt/newspaper/.env with APP_KEY, APP_URL, the DB_* and QUEUE_REDIS_*
# values, and the provider API keys. IMAGE_TAG is set per deploy by CI (falls
# back to :latest).

# Settings shared by every service that runs the app image.
x-app: &app
  image: ghcr.io/prismaticoder/newspaper-be:${IMAGE_TAG:-latest}
  env_file: .env
  # Point the app at the MySQL and Redis services on the compose network,
  # regardless of what the .env says (its DB_HOST etc. are for the app container).
  environment: &app-env
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    QUEUE_REDIS_HOST: redis
    QUEUE_REDIS_PORT: 6379
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-newspaper}
      MYSQL_USER: ${DB_USER:-newspaper}
      MYSQL_PASSWORD: ${DB_PASSWORD:-newspaper}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    # No host port published — MySQL is only reached over the compose network.
    volumes:
      - mysql-data:/var/lib/mysql
    # Ping over TCP (127.0.0.1), not the unix socket, so the check only passes
    # once the real networked server is up — during first-boot init MySQL answers
    # on the socket well before it accepts TCP, which would let dependents start
    # too early. start_period covers that initial init on a fresh volume.
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    # No host port published — Redis is only reached over the compose network.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: run migrations once MySQL is healthy, then exit. The app and worker
  # wait for this to finish so no one races the schema.
  migrate:
    <<: *app
    command: ['node', 'ace', 'migration:run', '--force']
    restart: 'no'
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *app
    command: ['node', 'bin/server.js']
    # No host port — the app is reached only through Caddy on the compose
    # network, so it is never exposed directly to the internet.
    expose:
      - '3333'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Drains the Redis-backed queues — the heavy edition builds and category
  # generation on 'default', and the hourly scheduler tick on 'scheduler'. No
  # separate scheduler process is needed; without this worker those features
  # never run.
  worker:
    <<: *app
    command: ['node', 'ace', 'queue:listen']
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Reverse proxy with automatic HTTPS. It terminates TLS for the domain and
  # forwards to the app over the internal network. Certificates are stored in the
  # caddy-data volume so they survive restarts and are not re-requested.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:
