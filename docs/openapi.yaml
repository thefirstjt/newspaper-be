openapi: 3.0.3
info:
  title: See Newspaper API
  version: '1.0.0'
  description: >
    REST API for See Newspaper, a personal AI newspaper by Percussion Labs.
    All successful responses are wrapped in a `data` object unless noted.
    Errors are either `{ "error": string }` (domain rule) or
    `{ "errors": [ { message, field?, rule? } ] }` (validation / auth).
    Authentication is bearer-token; there are two independent token types —
    reader tokens (from `/auth/login` or `/onboarding/accept`) and admin tokens
    (from `/admin/login`) — which are not interchangeable. Tokens do not expire.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: '{apiBase}/api/v1'
    variables:
      apiBase:
        default: 'http://localhost:3333'
        description: Origin the backend is served from.

tags:
  - name: Auth
    description: Reader login.
  - name: Onboarding
    description: Invite-only, magic-link, multi-stage reader onboarding.
  - name: Reader – Account
    description: The signed-in reader's profile and session.
  - name: Reader – Editions
    description: Daily editions and acting on their items (rate, discard).
  - name: Reader – Quiz
    description: Answering the daily quiz and the running score.
  - name: Reader – Links
    description: Submitting links for a future edition.
  - name: Reader – Persona
    description: The reader's persona document (view, edit, generate).
  - name: Reader – Config
    description: Per-reader categories, sources, schedule and learning topics.
  - name: Reader – Pipeline
    description: Rebuilding an edition on demand.
  - name: Admin
    description: Admin login and inviting readers.

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log a reader in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }

  /onboarding/invitation:
    get:
      tags: [Onboarding]
      summary: Validate an invitation magic-link token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Valid, pending invitation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      email: { type: string, format: email }
        '404': { $ref: '#/components/responses/DomainError' }

  /onboarding/accept:
    post:
      tags: [Onboarding]
      summary: Accept an invitation and create the reader account (stage 1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password]
              properties:
                token: { type: string }
                name: { type: string, maxLength: 200 }
                password: { type: string, minLength: 8, maxLength: 32 }
      responses:
        '200':
          description: Account created and logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
        '409': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/DomainOrValidationError' }

  /onboarding/categories:
    post:
      tags: [Onboarding]
      summary: Build categories and discover their sources (stage 3)
      description: >
        Provide EITHER an explicit list of categories, OR free-text interests
        the model turns into categories. For each category the model proposes
        RSS sources and each feed is fetched + verified; only working feeds are
        kept. Runs synchronously and can take several seconds. A category may
        return with an empty `sources` array if no feed resolved.
      security: [{ readerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [categories]
                  properties:
                    categories:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [title]
                        properties:
                          title: { type: string, maxLength: 200 }
                          description: { type: string, maxLength: 2000 }
                - type: object
                  required: [interests]
                  properties:
                    interests: { type: string, maxLength: 5000 }
      responses:
        '200':
          description: Categories created with their verified sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/DomainOrValidationError' }

  /account/profile:
    get:
      tags: [Reader – Account]
      summary: The current reader
      security: [{ readerAuth: [] }]
      responses:
        '200':
          description: Reader profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /account/logout:
    post:
      tags: [Reader – Account]
      summary: Log the reader out
      security: [{ readerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /editions/today:
    get:
      tags: [Reader – Editions]
      summary: Today's edition
      security: [{ readerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Edition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DomainError' }

  /editions/{date}:
    get:
      tags: [Reader – Editions]
      summary: The edition for a given day
      security: [{ readerAuth: [] }]
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, example: '2026-07-15' }
      responses:
        '200': { $ref: '#/components/responses/Edition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DomainError' }

  /items/{id}/rate:
    post:
      tags: [Reader – Editions]
      summary: Rate an item 1–5
      security: [{ readerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                note: { type: string, nullable: true, maxLength: 1000 }
      responses:
        '200':
          description: The rated item
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/DomainOrValidationError' }

  /items/{id}/discard:
    post:
      tags: [Reader – Editions]
      summary: Discard a surfaced item; promotes the next reserve
      security: [{ readerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The discarded item and its replacement (if any)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      discarded: { $ref: '#/components/schemas/Item' }
                      promoted:
                        type: object
                        nullable: true
                        description: The promoted replacement item, or null if none remained.
                        allOf:
                          - { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/DomainError' }

  /quiz/score:
    get:
      tags: [Reader – Quiz]
      summary: Running quiz score
      security: [{ readerAuth: [] }]
      responses:
        '200':
          description: Score summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      answered: { type: integer }
                      correct: { type: integer }
                      accuracy: { type: number, description: '0–1, 2dp' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /quiz/{id}/answer:
    post:
      tags: [Reader – Quiz]
      summary: Answer a quiz question; reveals the correct answer
      security: [{ readerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selectedIndex]
              properties:
                selectedIndex: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isCorrect: { type: boolean }
                      correctIndex: { type: integer }
                      explanation: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/DomainOrValidationError' }

  /links:
    post:
      tags: [Reader – Links]
      summary: Submit a link for a future edition
      security: [{ readerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                note: { type: string, nullable: true, maxLength: 1000 }
                targetDate:
                  type: string
                  enum: [today, tomorrow]
                  default: tomorrow
      responses:
        '200':
          description: The stored link
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SubmittedLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationErrorBody' }

  /persona:
    get:
      tags: [Reader – Persona]
      summary: The reader's persona document
      security: [{ readerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Persona' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Reader – Persona]
      summary: Directly edit the persona
      security: [{ readerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 10000 }
      responses:
        '200': { $ref: '#/components/responses/Persona' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationErrorBody' }

  /persona/generate:
    post:
      tags: [Reader – Persona]
      summary: Generate the persona from onboarding details (stage 2)
      description: Also replaces the reader's learning-gap topics from `learningGoals`.
      security: [{ readerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaGenerateRequest' }
      responses:
        '200': { $ref: '#/components/responses/Persona' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationErrorBody' }

  /run-daily:
    post:
      tags: [Reader – Pipeline]
      summary: Rebuild today's edition on demand (slow)
      description: Scouts sources and runs several LLM calls; may email the reader.
      security: [{ readerAuth: [] }]
      responses:
        '200':
          description: Build result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      date: { type: string }
                      status: { type: string }
                      failures:
                        type: array
                        items:
                          type: object
                          properties:
                            source: { type: string }
                            message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /config/categories:
    get:
      tags: [Reader – Config]
      summary: List the reader's categories (with sources)
      security: [{ readerAuth: [] }]
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Reader – Config]
      summary: Create a category
      security: [{ readerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, title, min, max, poolSize, relevanceHint]
              properties:
                key: { type: string, pattern: '^[a-z0-9-]+$', maxLength: 100 }
                title: { type: string, maxLength: 200 }
                min: { type: integer, minimum: 0, maximum: 50 }
                max: { type: integer, minimum: 1, maximum: 50 }
                poolSize: { type: integer, minimum: 1, maximum: 100 }
                relevanceHint: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/DomainOrValidationError' }

  /config/categories/{id}:
    put:
      tags: [Reader – Config]
      summary: Update a category (key is immutable)
      security: [{ readerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                min: { type: integer, minimum: 0, maximum: 50 }
                max: { type: integer, minimum: 1, maximum: 50 }
                poolSize: { type: integer, minimum: 1, maximum: 100 }
                relevanceHint: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/DomainOrValidationError' }
    delete:
      tags: [Reader – Config]
      summary: Delete a category (cascades to its sources)
      security: [{ readerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DomainError' }

  /config/sources:
    get:
      tags: [Reader – Config]
      summary: List the reader's sources
      security: [{ readerAuth: [] }]
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sources:
                        type: array
                        items: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Reader – Config]
      summary: Create a source under one of the reader's categories
      security: [{ readerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, type, name, settings]
              properties:
                categoryId: { type: integer }
                type: { type: string, enum: [rss, youtube, websearch, x] }
                name: { type: string, maxLength: 200 }
                settings: { $ref: '#/components/schemas/SourceSettings' }
                enabled: { type: boolean, default: true }
      responses:
        '200': { $ref: '#/components/responses/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/DomainOrValidationError' }

  /config/sources/{id}:
    put:
      tags: [Reader – Config]
      summary: Update a source
      security: [{ readerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryId: { type: integer }
                type: { type: string, enum: [rss, youtube, websearch, x] }
                name: { type: string, maxLength: 200 }
                settings: { $ref: '#/components/schemas/SourceSettings' }
                enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/DomainOrValidationError' }
    delete:
      tags: [Reader – Config]
      summary: Delete a source
      security: [{ readerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DomainError' }

  /config/schedule:
    get:
      tags: [Reader – Config]
      summary: The reader's schedule & email settings
      security: [{ readerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Reader – Config]
      summary: Update schedule & email settings
      security: [{ readerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                runTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '21:00' }
                emailEnabled: { type: boolean }
                emailFrequency: { type: string, enum: [daily, weekly, monthly] }
      responses:
        '200': { $ref: '#/components/responses/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationErrorBody' }

  /config/gap-topics:
    get:
      tags: [Reader – Config]
      summary: The reader's learning-gap topics
      security: [{ readerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/GapTopics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Reader – Config]
      summary: Replace the learning-gap topics
      security: [{ readerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topics]
              properties:
                topics:
                  type: array
                  items: { type: string, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/GapTopics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationErrorBody' }

  /admin/login:
    post:
      tags: [Admin]
      summary: Log an admin in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 100 }
                password: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      admin:
                        type: object
                        properties:
                          id: { type: integer }
                          username: { type: string }
                      token: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }

  /admin/me:
    get:
      tags: [Admin]
      summary: The current admin
      security: [{ adminAuth: [] }]
      responses:
        '200':
          description: Admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      username: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/logout:
    post:
      tags: [Admin]
      summary: Log the admin out
      security: [{ adminAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/invitations:
    get:
      tags: [Admin]
      summary: List invitations (newest first)
      security: [{ adminAuth: [] }]
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invitations:
                        type: array
                        items: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin]
      summary: Invite one or more readers by email
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails:
                  type: array
                  minItems: 1
                  items: { type: string, format: email }
      responses:
        '200':
          description: Invitations created (and any skipped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invited:
                        type: array
                        items: { $ref: '#/components/schemas/Invitation' }
                      skipped:
                        type: array
                        description: Emails that already belong to a reader
                        items: { type: string, format: email }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationErrorBody' }

components:
  securitySchemes:
    readerAuth:
      type: http
      scheme: bearer
      description: Reader bearer token from /auth/login or /onboarding/accept.
    adminAuth:
      type: http
      scheme: bearer
      description: Admin bearer token from /admin/login.

  responses:
    Unauthorized:
      description: Missing or invalid token (wrong token type also lands here)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorBody' }
    DomainError:
      description: A specific rule failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainErrorBody' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorBody' }
    ValidationErrorBody:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorBody' }
    DomainOrValidationError:
      description: Either a domain rule or a validation error
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/DomainErrorBody' }
              - { $ref: '#/components/schemas/ValidationErrorBody' }
    Message:
      description: A bare status message (not wrapped in data)
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    Edition:
      description: An edition
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Edition' }
    Persona:
      description: The persona document
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  persona: { type: string }
    Category:
      description: A category
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Category' }
    Source:
      description: A source
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Source' }
    Schedule:
      description: Schedule & email settings
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Schedule' }
    GapTopics:
      description: Learning-gap topics
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  topics:
                    type: array
                    items: { type: string }

  schemas:
    DomainErrorBody:
      type: object
      properties:
        error: { type: string }
    ValidationErrorBody:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message: { type: string }
              field: { type: string }
              rule: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
        initials: { type: string }

    Edition:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, example: '2026-07-15' }
        status: { type: string, enum: [building, ready, emailed] }
        keyLearning: { type: string, nullable: true, description: markdown }
        categories:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              title: { type: string }
              items:
                type: array
                items: { $ref: '#/components/schemas/Item' }
        quiz:
          type: array
          description: Answers are withheld here
          items:
            type: object
            properties:
              id: { type: integer }
              topic: { type: string }
              question: { type: string }
              options:
                type: array
                items: { type: string }

    Item:
      type: object
      properties:
        id: { type: integer }
        categoryKey: { type: string }
        title: { type: string }
        url: { type: string }
        summary: { type: string, nullable: true }
        source: { type: string, nullable: true }
        author: { type: string, nullable: true }
        mediaType: { type: string, enum: [article, video, podcast] }
        publishedAt: { type: string, format: date-time, nullable: true }
        rating:
          nullable: true
          type: object
          properties:
            stars: { type: integer }
            note: { type: string, nullable: true }

    SubmittedLink:
      type: object
      properties:
        id: { type: integer }
        url: { type: string }
        note: { type: string, nullable: true }
        targetDate: { type: string, example: '2026-07-16' }
        source: { type: string, enum: [api, telegram] }
        status: { type: string, enum: [pending, consumed] }

    Category:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        title: { type: string }
        min: { type: integer }
        max: { type: integer }
        poolSize: { type: integer }
        relevanceHint: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }

    Source:
      type: object
      properties:
        id: { type: integer }
        categoryId: { type: integer }
        type: { type: string, enum: [rss, youtube, websearch, x] }
        name: { type: string }
        settings: { $ref: '#/components/schemas/SourceSettings' }
        enabled: { type: boolean }
        lastFetchedAt: { type: string, format: date-time, nullable: true }

    SourceSettings:
      type: object
      description: Only the field(s) relevant to the source `type` are used.
      properties:
        feedUrl: { type: string, format: uri, description: 'rss' }
        channelId: { type: string, description: 'youtube' }
        query: { type: string, description: 'websearch' }
        username: { type: string, description: 'x (handle, no @)' }

    Schedule:
      type: object
      properties:
        runTime: { type: string, example: '21:00' }
        emailEnabled: { type: boolean }
        emailFrequency: { type: string, enum: [daily, weekly, monthly] }

    Invitation:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        status: { type: string, enum: [pending, accepted] }
        expiresAt: { type: string, format: date-time }
        acceptedUserId: { type: string, format: uuid, nullable: true }

    PersonaGenerateRequest:
      type: object
      required: [role, learningGoals]
      properties:
        role: { type: string, maxLength: 200 }
        learningGoals:
          type: array
          minItems: 1
          items: { type: string, maxLength: 200 }
        industry: { type: string, nullable: true, maxLength: 200 }
        experienceLevel: { type: string, nullable: true, maxLength: 100 }
        interests:
          type: array
          items: { type: string, maxLength: 200 }
        goals: { type: string, nullable: true, maxLength: 1000 }
        preferredDepth:
          type: string
          nullable: true
          enum: [deep, balanced, high-level]
        avoid:
          type: array
          items: { type: string, maxLength: 200 }
        location: { type: string, nullable: true, maxLength: 200 }
